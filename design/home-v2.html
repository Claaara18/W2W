<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>W2W Home v2 排版優化</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,800;1,400&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,700;8..60,900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3EEE5; --ink:#1A120B; --brown:#5A4628; --label:#7A6650; --muted:#8C7758;
  --line:#C9B9A6; --sun:#F2E4BC; --card:#FBF9F5;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:Inter,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --spring:cubic-bezier(.2,1.4,.35,1); --out:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#E4DCCF;font-family:var(--sans);color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.phone{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden}
@media (min-width:520px) and (min-height:700px){
  .phone{width:393px;height:min(852px,calc(100vh - 40px));border-radius:44px;box-shadow:0 30px 80px -20px rgba(60,40,15,.35),0 0 0 10px #1A120B}
}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.scroller::-webkit-scrollbar{display:none}
.content{position:relative;min-height:100%;padding:0 20px 130px}

/* hero */
.sun{position:absolute;right:-60px;top:-56px;width:252px;height:252px;border-radius:50%;background:var(--sun);transform:scale(.55);opacity:0}
.in .sun{animation:sunIn 1.1s var(--out) .05s both, sunBreath 7s ease-in-out 1.3s infinite}
@keyframes sunIn{to{transform:scale(1);opacity:1}}
@keyframes sunBreath{50%{transform:scale(1.035)}}
.hero{position:relative;padding-top:84px}
h1{margin:0;font-family:var(--serif);font-size:56px;line-height:.9;letter-spacing:-.01em;font-weight:400}
h1 b{font-weight:900}
.ln{display:block;overflow:hidden;padding-bottom:.14em}
.ln>span{display:block;transform:translateY(110%)}
.in .ln>span{animation:lineUp .9s var(--out) both}
.in .ln:nth-child(2)>span{animation-delay:.12s}
@keyframes lineUp{to{transform:none}}
.tag{margin:8px 0 0;font-style:italic;color:var(--label);font-size:15px}

[data-in]{opacity:0;transform:translateY(18px)}
.in [data-in]{animation:rise .75s var(--out) both;animation-delay:calc(var(--d)*80ms + 260ms)}
@keyframes rise{to{opacity:1;transform:none}}

.sec{margin-top:32px}
.lab{font-size:11px;font-weight:800;letter-spacing:.3em;color:var(--label);text-transform:uppercase}

/* weather */
.wx{display:flex;align-items:center;gap:8px;margin-top:16px}
.wx svg{width:22px;height:22px;animation:bob 4s ease-in-out infinite}
.wx .ray{transform-origin:21px 10px;animation:spin 14s linear infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.temp{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.cond{color:var(--label);font-size:15px}

/* chips */
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.chip{height:40px;padding:0;border-radius:99px;border:1.5px solid var(--line);font-weight:500;font-size:15px;transition:background .28s,color .28s,border-color .28s,transform .18s var(--out)}
.chip:active{transform:scale(.93)}
.chip[aria-pressed=true]{background:#EADFCB;color:var(--ink);border-color:var(--ink);font-weight:700}
.chip.pop{animation:pop .42s var(--spring)}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:none}}

/* CTA */
.cta{position:relative;display:block;width:100%;margin-top:12px;padding:17px 20px 16px;text-align:left;border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:22px;overflow:hidden;transition:transform .2s var(--out),background .35s,color .35s,box-shadow .3s}
.cta:active{transform:scale(.975)}
.cta-t{display:block;font-family:var(--serif);font-weight:700;font-size:20px}
.cta-s{display:block;margin-top:4px;color:#CDBFA8;font-size:13px;letter-spacing:.06em;transition:color .35s}
.cta-arrow{position:absolute;right:20px;top:50%;width:22px;height:22px;margin-top:-11px;transition:transform .35s var(--spring),opacity .2s}
.cta:hover .cta-arrow{transform:translateX(4px)}
.cta.loading{background:var(--ink);color:#fff;pointer-events:none}
.cta.loading .cta-s{color:#CDBFA8}
.cta.loading .cta-arrow{opacity:0}
.cta .bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--sun)}
.cta.loading .bar{animation:bar var(--think,2.6s) linear forwards}
@keyframes bar{to{width:100%}}
.cta.nudge{animation:nudge 1.1s var(--out)}
@keyframes nudge{20%{box-shadow:0 0 0 6px rgba(90,70,40,.16)}100%{box-shadow:0 0 0 0 rgba(90,70,40,0)}}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.2);transform:translate(-50%,-50%) scale(0);width:20px;height:20px;pointer-events:none;animation:ripple .6s ease-out forwards}
@keyframes ripple{to{transform:translate(-50%,-50%) scale(28);opacity:0}}
.swap{display:inline-block;animation:swap .4s var(--out)}
@keyframes swap{from{opacity:0;transform:translateY(8px)}}
.dots i{display:inline-block;width:4px;height:4px;margin-left:3px;border-radius:50%;background:currentColor;animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-4px);opacity:1}}

/* section 3 */
.s3h{position:relative}
.sub{margin:8px 0 0;font-style:italic;color:var(--label);font-size:13px}
.box{position:relative;margin-top:16px;height:72px;border:1.5px dashed var(--line);border-radius:22px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--label);font-size:13px;transition:border-color .3s,background .3s,height .35s var(--out)}
.box svg{width:18px;height:18px;animation:bob 2.2s ease-in-out infinite}
.box .hint{transition:opacity .25s}
.box.thinking{background:rgba(242,228,188,.28);border-color:#D9C79F;height:150px}
.box.thinking .hint{opacity:0}
.box .cap{position:absolute;left:0;right:0;bottom:9px;text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:0;transition:opacity .3s}
.box.thinking .cap{opacity:1}
.box[hidden],.looks[hidden]{display:none}

.looks{margin:10px -20px 0;padding:6px 20px 18px;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-padding:0 20px}
.looks::-webkit-scrollbar{display:none}
.look{flex:0 0 228px;scroll-snap-align:start;background:var(--card);border:1px solid #E6DCCD;border-radius:26px;padding:14px 14px 16px;box-shadow:0 10px 26px -14px rgba(70,50,20,.35);transition:transform .35s var(--spring),box-shadow .35s,opacity .35s;will-change:transform}
.look:active{transform:scale(.975)}
.look.dim{opacity:.5}
.look.picked{transform:translateY(-6px);box-shadow:0 18px 34px -14px rgba(70,50,20,.45);border-color:var(--brown)}
.no{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--label);display:flex;justify-content:space-between}
.stage{position:relative;height:150px;margin-top:10px;border-radius:18px;overflow:hidden}
.stage img{position:absolute;filter:drop-shadow(0 5px 6px rgba(50,30,10,.16));transform:scale(.4) rotate(-8deg);opacity:0}
.look.landed .stage img{animation:garment .6s var(--spring) both}
.look.landed .stage img:nth-child(2){animation-delay:.09s}.look.landed .stage img:nth-child(3){animation-delay:.18s}
@keyframes garment{to{transform:rotate(var(--r,0deg));opacity:1}}
.look h3{margin:10px 0 0;font-family:var(--serif);font-weight:700;font-size:20px}
.look p{margin:4px 0 0;font-size:13px;color:var(--label);letter-spacing:.03em}
.wear{margin-top:12px;width:100%;height:38px;border-radius:99px;border:1.5px solid var(--ink);font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .3s,color .3s,transform .18s var(--out)}
.wear:active{transform:scale(.95)}
.wear svg{width:0;height:14px;transition:width .3s var(--spring)}
.picked .wear{background:var(--ink);color:#fff}
.picked .wear svg{width:14px}
.pager{display:flex;justify-content:center;gap:6px;margin-top:2px}
.pager i{width:6px;height:6px;border-radius:99px;background:var(--line);transition:width .3s var(--out),background .3s}
.pager i.on{width:18px;background:var(--brown)}
.pager[hidden]{display:none}

/* tab bar */
.tabs{position:absolute;left:0;right:0;bottom:0;height:86px;padding:0 14px 14px;background:var(--bg);border-top:1px solid #DDD2C2;display:flex;transform:translateY(100%)}
.in .tabs{animation:tabsUp .7s var(--out) .5s both}
@keyframes tabsUp{to{transform:none}}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--muted);font-size:8.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;transition:transform .18s var(--out),color .2s}
.tab:active{transform:scale(.88)}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--brown)}
.toast{position:absolute;left:50%;bottom:100px;transform:translate(-50%,16px);background:var(--ink);color:#fff;font-size:12.5px;padding:9px 15px;border-radius:99px;opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .25s,transform .35s var(--spring);z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* squirrel */
.perch{position:absolute;width:0;height:0}
.sq{position:absolute;left:0;top:0;width:0;height:0;z-index:6;will-change:transform;opacity:0}
.sq.ready{opacity:1}
.sq-hit{position:absolute;left:-52px;bottom:-4px;width:104px;height:112px;border-radius:40px}
.sq-shadow{position:absolute;left:-34px;top:-5px;width:72px;height:11px;border-radius:50%;background:rgba(70,45,15,.16);transition:transform .1s}
.sq-dir{position:absolute;left:0;top:0;transform:scaleX(var(--dir,1))}
.sq-sq{position:absolute;left:0;top:0;transform-origin:0 0}
.pose{position:absolute;bottom:0;display:none;transform-origin:50% 100%}
.pose img{position:absolute;left:0;top:0;width:100%;height:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
.sq[data-pose=idle] .p-idle,.sq[data-pose=happy] .p-happy,.sq[data-pose=think] .p-think,.sq[data-pose=acorn] .p-acorn,.sq[data-pose=sleep] .p-sleep{display:block}
.p-idle{width:107px;height:109px;left:-44px;animation:breathe 3.2s ease-in-out infinite}
.p-happy{width:115px;height:116px;left:-45px}
.p-think{width:115px;height:113px;left:-37px;animation:ponder 1.5s ease-in-out infinite}
.p-acorn{width:108px;height:111px;left:-41px;animation:breathe 2.2s ease-in-out infinite}
.p-sleep{width:135px;height:88px;left:-60px;animation:snooze 3.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.012,1.022)}}
@keyframes snooze{50%{transform:scale(1.02,1.045)}}
@keyframes ponder{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
.tail{animation:wag 2.3s ease-in-out infinite alternate}
.p-idle .tail{transform-origin:67% 92%}
.p-happy .tail{transform-origin:66% 89%}
.sq.excited .tail,.p-happy .tail{animation-duration:.26s}
@keyframes wag{from{transform:rotate(1.6deg)}to{transform:rotate(-6.5deg)}}
.blink{opacity:0}
.sq.blinking .p-idle .blink{opacity:1}
.sq.blinking .p-idle .eyes-open{opacity:0}
.p-think .q{transform-origin:10% 12%;animation:qmark 1s ease-in-out infinite}
@keyframes qmark{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-5px) rotate(8deg)}}
.p-happy .spark{transform-origin:6% 20%;animation:spark .5s ease-in-out infinite alternate}
@keyframes spark{from{transform:scale(.7);opacity:.4}to{transform:scale(1.15);opacity:1}}
.zzz{position:absolute;width:33px;height:30px;left:20px;top:-14px;animation:zzz 2.8s ease-in-out infinite}
.zzz img{position:static}
@keyframes zzz{0%{transform:translate(-4px,6px) scale(.8);opacity:0}40%{opacity:1}100%{transform:translate(6px,-10px) scale(1.08);opacity:0}}
.bubble{position:absolute;left:-98px;top:-128px;width:50px;height:50px;border-radius:50%;background:#fff;box-shadow:0 6px 14px -6px rgba(70,45,15,.35);display:flex;align-items:center;justify-content:center;transform:scale(0);transition:transform .35s var(--spring)}
.bubble::before,.bubble::after{content:"";position:absolute;background:#fff;border-radius:50%}
.bubble::before{width:10px;height:10px;right:-4px;bottom:-3px}
.bubble::after{width:6px;height:6px;right:-12px;bottom:-11px}
.bubble.show{transform:scale(1)}
.bubble img{max-width:32px;max-height:32px;animation:flick .28s var(--out)}
@keyframes flick{from{transform:scale(.5) rotate(-12deg);opacity:0}}
.bit{position:absolute;left:0;top:0;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:7}
.plus{position:absolute;left:0;top:0;z-index:7;font-family:var(--mono);font-size:12px;font-weight:500;color:var(--brown);white-space:nowrap;pointer-events:none}
@media (prefers-reduced-motion:reduce){.sun,.wx svg,.wx .ray,.box svg{animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="scroller" id="scroller">
    <div class="content" id="content">
      <div class="sun"></div>
      <header class="hero">
        <h1><span class="ln"><span>What to</span></span><span class="ln"><span><b>wear?</b></span></span></h1>
        <p class="tag" data-in style="--d:1">A small ritual, every morning.</p>
        <div class="wx" data-in style="--d:2">
          <svg viewBox="0 0 32 32" aria-hidden="true"><g class="ray" stroke="#E0A63E" stroke-width="2" stroke-linecap="round"><path d="M21 1.5v2.6M12.6 5l1.9 1.9M29.4 5l-1.9 1.9M30.5 12h-2.4"/></g><circle cx="21" cy="12" r="5.6" fill="#E9B24A"/><path d="M9.5 27.5a6 6 0 0 1-.6-11.97A7.6 7.6 0 0 1 23.4 17.6a5 5 0 0 1-.9 9.9z" fill="#DDA443"/></svg>
          <span class="temp"><span id="temp">0</span>°</span><span class="cond">大致晴</span>
        </div>
        <span class="perch" id="perchHero" style="right:55px;top:206px"></span>
      </header>

      <section class="sec" data-in style="--d:3">
        <div class="lab">01. Occasion</div>
        <div class="chips" id="chips">
          <button class="chip" aria-pressed="true">Casual</button>
          <button class="chip" aria-pressed="false">School</button>
          <button class="chip" aria-pressed="false">Work</button>
          <button class="chip" aria-pressed="false">Date</button>
        </div>
        <button class="cta" id="cta">
          <span class="cta-t" id="ctaT">What to wear today</span>
          <span class="cta-s" id="ctaS">Casual · 22°C</span>
          <svg class="cta-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <span class="bar"></span>
        </button>
      </section>

      <section class="sec" data-in style="--d:4;margin-top:44px">
        <div class="s3h">
          <div class="lab">02. Today's edit</div>
          <p class="sub" id="sub">Three looks for you</p>
          <span class="perch" id="perchHead" style="right:42px;bottom:-30px"></span>
        </div>
        <div class="box" id="box">
          <svg class="hint" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5M6 11l6-6 6 6"/></svg>
          <span class="hint">選好場合，按上方按鈕看推薦</span>
          <span class="cap" id="cap">Thinking</span>
          <span class="perch" id="perchBox" style="left:56%;bottom:30px"></span>
        </div>
        <div class="looks" id="looks" hidden></div>
        <div class="pager" id="pager" hidden><i class="on"></i><i></i><i></i></div>
      </section>

      <div class="sq" id="sq" data-pose="idle">
        <div class="sq-shadow" id="sqShadow"></div>
        <div class="bubble" id="bubble"></div>

const S={x:0,y:0,state:'idle',perch:'perchHero'};
function place(){sq.style.transform=`translate(${S.x}px,${S.y}px)`}
function perchPos(id){const r=$(id).getBoundingClientRect(),c=content.getBoundingClientRect();return{x:r.left-c.left,y:r.top-c.top}}
function pose(p){sq.dataset.pose=p;if(p!=='idle')sq.style.setProperty('--dir',1)}
function squash(sx,sy,ty=0){sqSq.style.transform=`translateY(${ty}px) scale(${sx},${sy})`}
function hopTo(tx,ty,{step=34,height=16,ms=230}={}){
  return new Promise(res=>{
    const x0=S.x,y0=S.y,d=Math.hypot(tx-x0,ty-y0);
    if(d<2)return res();
    const n=Math.max(1,Math.round(d/step)),total=n*ms,t0=performance.now();
    if(Math.abs(tx-x0)>6)sq.style.setProperty('--dir',tx>x0?-1:1);
    (function f(now){
      let t=Math.min(1,(now-t0)/total),h=t*n,i=Math.min(n-1,Math.floor(h)),p=t>=1?1:h-i;
      const air=Math.sin(Math.PI*Math.min(1,p/.82));          // airborne part of each hop
      const g=(i+Math.min(1,p/.82))/n;
      S.x=x0+(tx-x0)*g;S.y=y0+(ty-y0)*g;place();
      if(p<.82)squash(1-.05*air,1+.07*air,-height*air);
      else{const q=Math.sin(Math.PI*(p-.82)/.18);squash(1+.07*q,1-.09*q)}
      $('sqShadow').style.transform=`scale(${1-.3*air})`;
      if(t<1)requestAnimationFrame(f);else{squash(1,1);res()}
    })(t0);
  });
}
function jump(times=2,h=30){
  return sqSq.animate([
    {transform:'translateY(0) scale(1.1,.86)',offset:0},
    {transform:`translateY(${-h}px) scale(.95,1.07)`,offset:.42,easing:'cubic-bezier(.3,0,.7,1)'},
    {transform:'translateY(0) scale(1.1,.88)',offset:.82},
    {transform:'translateY(0) scale(1,1)',offset:1}
  ],{duration:430,iterations:times,easing:'cubic-bezier(.2,.7,.4,1)'}).finished.catch(()=>{});
}
function confetti(n=18){
  const cols=['#C9A46A','#8A5A2B','#F2E4BC','#E0C9C9','#C9D1E3','#E9B24A'];
  for(let i=0;i<n;i++){
    const b=document.createElement('i');b.className='bit';b.style.background=cols[i%cols.length];
    if(i%3===0)b.style.borderRadius='50%';
    content.appendChild(b);
    const a=rand(-Math.PI*.95,-Math.PI*.05),v=rand(50,105),dx=Math.cos(a)*v,dy=Math.sin(a)*v;
    b.animate([
      {transform:`translate(${S.x}px,${S.y-60}px) rotate(0) scale(.4)`,opacity:1},
      {transform:`translate(${S.x+dx}px,${S.y-60+dy}px) rotate(${rand(120,300)}deg) scale(1)`,opacity:1,offset:.45,easing:'cubic-bezier(.4,0,1,.6)'},
      {transform:`translate(${S.x+dx*1.25}px,${S.y-60+dy+rand(70,120)}px) rotate(${rand(300,560)}deg) scale(.8)`,opacity:0}
    ],{duration:rand(900,1300),easing:'cubic-bezier(.1,.7,.3,1)'}).onfinish=()=>b.remove();
  }
}
function floatText(txt){
  const e=document.createElement('span');e.className='plus';e.textContent=txt;content.appendChild(e);
  e.animate([{transform:`translate(${S.x-34}px,${S.y-118}px)`,opacity:0},{transform:`translate(${S.x-34}px,${S.y-134}px)`,opacity:1,offset:.25},{transform:`translate(${S.x-34}px,${S.y-160}px)`,opacity:0}],{duration:1500,easing:'ease-out'}).onfinish=()=>e.remove();
}
async function celebrate(p='happy',times=2){
  S.state='celebrating';pose(p);sq.classList.add('excited');confetti();buzz([10,40,10]);
  await jump(times);await sleep(520);
  sq.classList.remove('excited');pose('idle');S.state='idle';touch();
}
/* idle life: blink, wander, sleep */
function blink(){
  if(sq.dataset.pose==='idle'){sq.classList.add('blinking');setTimeout(()=>sq.classList.remove('blinking'),130);
    if(Math.random()<.25)setTimeout(()=>{sq.classList.add('blinking');setTimeout(()=>sq.classList.remove('blinking'),110)},260)}
  setTimeout(blink,rand(1800,4600));
}
let lastTouch=performance.now();
function touch(){lastTouch=performance.now()}
async function wake(){if(S.state!=='sleeping')return;pose('idle');S.state='idle';await jump(1,14)}
async function idleTick(){
  if(S.state==='idle'&&!busy){
    if(performance.now()-lastTouch>26000){S.state='sleeping';pose('sleep')}
    else{
      const r=Math.random(),p=perchPos(S.perch);
      if(r<.5){S.state='moving';await hopTo(p.x+rand(-26,26),p.y,{step:15,height:9,ms:210});if(S.state==='moving')S.state='idle'}
      else if(r<.75){sq.classList.add('excited');setTimeout(()=>sq.classList.remove('excited'),900)}
    }
  }
  setTimeout(idleTick,rand(2400,4800));
}
async function goPerch(id,opt){S.perch=id;const p=perchPos(id);S.state='moving';pose('idle');await hopTo(p.x,p.y,opt);S.state='idle'}

$('sqHit').addEventListener('click',async()=>{
  touch();buzz(8);
  if(S.state==='sleeping')return wake();
  if(S.state!=='idle'||busy)return;
  await celebrate(Math.random()<.5?'happy':'acorn',1);
});

/* ---------- UI feedback ---------- */
function setText(el,t){el.innerHTML=`<span class="swap">${t}</span>`}
let toastT;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),1900)}
$('chips').addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c||busy)return;
  touch();wake();buzz(6);
  document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c));
  c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');
  if(occasion===c.textContent)return;
  occasion=c.textContent;shuffle=0;
  setText($('ctaS'),`${occasion} · 22°C`);
  setText($('ctaT'),'What to wear today');
  cta.classList.remove('nudge');void cta.offsetWidth;cta.classList.add('nudge');
});
cta.addEventListener('pointerdown',e=>{
  const r=cta.getBoundingClientRect(),s=document.createElement('span');s.className='ripple';
  s.style.left=(e.clientX-r.left)+'px';s.style.top=(e.clientY-r.top)+'px';cta.appendChild(s);setTimeout(()=>s.remove(),650);
});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  buzz(6);touch();
  if(t.dataset.tab==='Home'){if(!busy)intro(true)}
  else toast(`這個 Prototype 先只做 Home，${t.dataset.tab} 尚未連結`);
}));
scroller.addEventListener('scroll',touch,{passive:true});

/* ---------- recommendation flow ---------- */
function buildLooks(){
  const list=LOOKS[occasion],o=shuffle%3;
  looksEl.innerHTML='';
  for(let k=0;k<3;k++){
    const [name,items,combo]=list[(k+o)%3],lay=LAYOUT[combo];
    const el=document.createElement('article');el.className='look';
    el.innerHTML=`<div class="no"><span>LOOK 0${k+1}</span><span>${occasion.toUpperCase()}</span></div>
      <div class="stage" style="background:${TINT[(k+o)%3]}">${A[combo].map(g=>{const[l0,t0,w0,r]=lay[g],l=l0*.8+20,t=t0*.8+1,w=w0*.8;return `<img src="${IMG[g]}" alt="${g}" style="left:${l}px;top:${t}px;width:${w}px;--r:${r}deg">`}).join('')}</div>
      <h3>${name}</h3><p>${items}</p>
      <button class="wear"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.500l3.200 3.200L13 5"/></svg><span>Wear this</span></button>`;
    looksEl.appendChild(el);
  }
}
function deal(){
  const cards=[...looksEl.children],host=looksEl.getBoundingClientRect(),mid=host.left+host.width/2;
  return Promise.all(cards.map((c,i)=>{
    const r=c.getBoundingClientRect(),dx=mid-(r.left+r.width/2)+(i-1)*40,rot=(i-1)*8;
    const a=c.animate([
      {transform:`translate(${dx}px,90px) rotate(${rot*.4}deg) scale(.6)`,opacity:0,offset:0,easing:'cubic-bezier(.2,1.3,.4,1)'},
      {transform:`translate(${dx}px,0) rotate(${rot}deg) scale(.84)`,opacity:1,offset:.42},
      {transform:`translate(${dx}px,0) rotate(${rot}deg) scale(.84)`,opacity:1,offset:.56,easing:'cubic-bezier(.3,1.25,.4,1)'},
      {transform:'none',opacity:1,offset:1}
    ],{duration:1150,delay:i*90,fill:'backwards'});
    c.style.zIndex=i===1?2:1;
    return a.finished.then(()=>{c.classList.add('landed');c.style.zIndex=''});
  }));
}
function clearLooks(){
  return Promise.all([...looksEl.children].map((c,i)=>c.animate([{transform:'none',opacity:1},{transform:`translateY(40px) rotate(${(i-1)*5}deg) scale(.9)`,opacity:0}],{duration:280,delay:i*50,easing:'ease-in',fill:'forwards'}).finished));
}
let bubbleT;
function think(on){
  const b=$('bubble');clearInterval(bubbleT);
  if(!on){b.classList.remove('show');return}
  const keys=['cami','cardi','skirt'];let i=0;
  const show=()=>{b.innerHTML=`<img src="${IMG[keys[i++%3]]}" alt="">`};
  show();b.classList.add('show');bubbleT=setInterval(show,300);
}
async function recommend(){
  if(busy)return;busy=true;touch();buzz(12);await wake();
  const THINK=2100;
  cta.style.setProperty('--think',(THINK+1100)+'ms');cta.classList.add('loading');
  $('ctaT').innerHTML='<span class="swap">Styling your day<span class="dots"><i></i><i></i><i></i></span></span>';
  if(hasResults){await clearLooks();looksEl.hidden=true;pager.hidden=true;box.hidden=false;hasResults=false}
  box.classList.add('thinking');
  $('cap').textContent=`${occasion} · 22°C · thinking`;
  const top=box.parentElement.offsetTop-150;
  scroller.scrollTo({top:Math.max(0,top),behavior:'smooth'});
  await sleep(380);
  await goPerch('perchBox',{step:60,height:26,ms:250});
  S.state='thinking';pose('think');think(true);
  await sleep(THINK);
  think(false);pose('idle');
  buildLooks();
  box.hidden=true;box.classList.remove('thinking');looksEl.hidden=false;pager.hidden=false;looksEl.scrollLeft=0;hasResults=true;
  setText($('sub'),`Three looks for ${occasion.toLowerCase()}`);
  buzz(8);
  const need=pager.getBoundingClientRect().bottom-scroller.getBoundingClientRect().top+scroller.scrollTop+24-(scroller.clientHeight-86);
  if(need>scroller.scrollTop)scroller.scrollTo({top:need,behavior:'smooth'});
  const d=deal();
  await goPerch('perchHead',{step:44,height:22,ms:210});
  await d;
  cta.classList.remove('loading');setText($('ctaT'),'Shuffle three more');shuffle++;
  await celebrate('happy',2);
  busy=false;
}
cta.addEventListener('click',recommend);
looksEl.addEventListener('click',async e=>{
  const c=e.target.closest('.look');if(!c||busy)return;
  touch();
  if(!e.target.closest('.wear')){buzz(5);return}
  const already=c.classList.contains('picked');
  [...looksEl.children].forEach(x=>{x.classList.toggle('picked',x===c&&!already);x.classList.toggle('dim',x!==c&&!already);
    x.querySelector('.wear span').textContent=(x===c&&!already)?'Wearing today':'Wear this'});
  if(already||S.state!=='idle')return;
  busy=true;floatText('+1 acorn');toast('已記錄今天的穿搭');
  await celebrate('acorn',2);busy=false;
});
looksEl.addEventListener('scroll',()=>{
  const i=Math.min(2,Math.round(looksEl.scrollLeft/242));
  [...pager.children].forEach((d,k)=>d.classList.toggle('on',k===i));touch();
},{passive:true});

/* ---------- intro ---------- */
function countTemp(){const t0=performance.now();(function f(n){const p=Math.min(1,(n-t0)/900);$('temp').textContent=Math.round(22*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}
async function intro(replay){
  busy=true;
  if(replay){
    document.body.classList.remove('in');scroller.scrollTo({top:0});
    looksEl.hidden=true;pager.hidden=true;box.hidden=false;hasResults=false;shuffle=0;
    setText($('ctaT'),'What to wear today');$('sub').textContent='Three looks for you';
    sq.classList.remove('ready');void document.body.offsetWidth;
  }
  $('temp').textContent='0';
  requestAnimationFrame(()=>document.body.classList.add('in'));
  setTimeout(countTemp,520);
  await sleep(850);
  const p=perchPos('perchHero');S.perch='perchHero';
  S.x=content.clientWidth+70;S.y=p.y;place();pose('idle');sq.classList.add('ready');
  S.state='moving';await hopTo(p.x,p.y,{step:36,height:18,ms:220});
  sq.style.setProperty('--dir',1);
  S.state='idle';busy=false;touch();
  await celebrate('happy',1);
}
window.addEventListener('resize',()=>{if(S.state==='idle'){const p=perchPos(S.perch);S.x=p.x;S.y=p.y;place()}});
(document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,sleep(1200)]):sleep(0)).then(()=>{intro(false);setTimeout(blink,2500);setTimeout(idleTick,4000)});
</script>
</body>
